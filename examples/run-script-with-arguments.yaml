document:
  dsl: '1.0.4'
  namespace: examples
  name: run-script-with-arguments
  version: 1.0.0
do:
  - setInput:
      set:
        message: Hello World
  - log:
      run:
        script:
          language: js
          arguments:
            message : ${.message}
          code: |
            console.log(message)
