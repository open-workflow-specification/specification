document:
  dsl: '1.1.0'
  namespace: examples
  name: run-script-with-stdin-and-arguments
  version: '1.0.0'
do:
  - runScript:
      run:
        script:
          language: js
          stdin: "Hello Workflow"
          environment:
            foo: bar
          arguments:
            arg: hello
          code: |
            
            console.log('stdin > ', readLine()) // Output: stdin > Hello Workflow
            console.log('arg > ', arg) // Output: arg > hello
            const foo = process.env.foo;
            console.log('env > ', foo) // Output: env > bar
